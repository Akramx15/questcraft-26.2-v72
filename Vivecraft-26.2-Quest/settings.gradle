pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
    }
}

plugins {
    // 0.8.0 fails while resolving current JDK 25 distributions (IBM_SEMERU).
    // 1.0.0 keeps the Gradle toolchain download reproducible on this branch.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

Properties properties = new Properties()
File file = new File(rootProject.getProjectDir(), "local.properties")
if (file.exists())
    properties.load(new FileReader(file))

// Command-line -P values make CI and one-off builds reproducible without
// writing a machine-specific local.properties file.
def buildProperty = { String name ->
    gradle.startParameter.projectProperties.get(name) ?: properties.getProperty(name)
}

include("common")
include("stubs")
if (!"true".equals(buildProperty("project.build.excludeFabric")))
    include("fabric")
if (!"true".equals(buildProperty("project.build.excludeForge")))
    include("forge")
if (!"true".equals(buildProperty("project.build.excludeNeoforge")))
    include("neoforge")

rootProject.name = "vivecraft"
