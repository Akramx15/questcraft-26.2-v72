import net.fabricmc.loom.util.ZipReprocessorUtil

plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom}"
}

def androidOpenXrJar = rootProject.file("fabric/src/main/resources/META-INF/jars/lwjgl-openxr-android-3.3.3.jar")
def sanitizedAndroidOpenXrJar = tasks.register("sanitizeAndroidOpenXrJar", Zip) {
    archiveFileName.set("lwjgl-openxr-android-3.3.3.jar")
    destinationDirectory.set(layout.buildDirectory.dir("generated/openxr"))
    from(zipTree(androidOpenXrJar)) {
        // The APK intentionally uses Unity's Android OpenXR loader. LWJGL's
        // Linux ARM64 sidecar describes a different binary and causes a false
        // incompatible-library warning even though the OpenXR session works.
        exclude "META-INF/linux/arm64/org/lwjgl/openxr/libopenxr_loader.so.sha1"
    }
}

sourceSets.main.resources.exclude("META-INF/jars/lwjgl-openxr-android-3.3.3.jar")

tasks.named("processResources") {
    dependsOn sanitizedAndroidOpenXrJar
    from(sanitizedAndroidOpenXrJar.flatMap { it.archiveFile }) {
        into("META-INF/jars")
    }
}

tasks.named("jar") {
    // Loom nests included dependencies after Gradle has normalized the main
    // archive. Re-run the same Loom normalizer after nesting so those entries
    // do not retain the wall-clock time at which JarNester added them.
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    doLast {
        ZipReprocessorUtil.reprocessZip(
            archiveFile.get().asFile.toPath(),
            reproducibleFileOrder,
            preserveFileTimestamps,
            entryCompression
        )
    }
}

tasks.register("verifyReproducibleJarMetadata") {
    dependsOn tasks.named("jar")

    def fabricJar = tasks.named("jar").flatMap { it.archiveFile }
    inputs.file(fabricJar)

    doLast {
        def entryTimes = new LinkedHashSet<Long>()
        new java.util.zip.ZipFile(fabricJar.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                entryTimes.add(entry.time)
            }
        }

        if (entryTimes.size() != 1) {
            throw new GradleException(
                "Expected one normalized timestamp in the Fabric JAR, found ${entryTimes.size()}: ${entryTimes}"
            )
        }
    }
}

tasks.named("check") {
    dependsOn tasks.named("verifyReproducibleJarMetadata")
}

loom {
    accessWidenerPath.set(project(':common').file("src/main/resources/${mod_id}.accesswidener"))
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // This file is also shipped as a nested JAR under META-INF/jars.
    implementation files(androidOpenXrJar)

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // for sodium compat
    compileOnly "maven.modrinth:sodium:mc26.2-0.9.1-fabric"
    runtimeOnly "maven.modrinth:sodium:mc26.2-0.9.1-fabric"

    // for iris compat
    compileOnly "maven.modrinth:iris:1.11.1+26.2-fabric"
    compileOnly 'org.anarres:jcpp:1.4.14' //temp iris
    compileOnly 'io.github.douira:glsl-transformer:3.0.0-pre3' //temp iris

    // for REI compat
    compileOnly("me.shedaniel:RoughlyEnoughItems-fabric:18.0.796") { exclude group: "net.fabricmc" exclude group: "net.fabricmc.fabric-api" exclude group: "dev.architectury" }

    // for Pehkui compat
    compileOnly("com.github.Virtuoel:Pehkui:3.7.12") { exclude group: "net.fabricmc" exclude group: "net.fabricmc.fabric-api" }

    // other mods
    // runtimeOnly("com.simibubi.create:create-fabric-1.19.2:0.5.0.i-969+1.19.2")
    // compileOnly "maven.modrinth:lithium:mc1.20.4-0.12.1"
    // compileOnly "maven.modrinth:indium:1.0.30+mc1.20.4"

    //mod menu
    //compileOnly("com.terraformersmc:modmenu:19.0.0-alpha.1") { exclude group: "net.fabricmc" exclude group: "net.fabricmc.fabric-api" }
    compileOnly "maven.modrinth:modmenu:19.0.0-alpha.1"

    // for immersive portals compat
    compileOnly('com.github.iPortalTeam:ImmersivePortalsMod:v5.1.7-mc1.20.4') { exclude group: "net.fabricmc" exclude group: "net.fabricmc.fabric-api" }

    // needed for resource loading
    include(implementation(fabricApi.module("fabric-resource-loader-v0", fabric_api_version)))
    include(implementation(fabricApi.module("fabric-resource-loader-v1", fabric_api_version)))
    // commands also needs base
    include(implementation(fabricApi.module("fabric-api-base", fabric_api_version)))
    include(implementation(fabricApi.module("fabric-command-api-v2", fabric_api_version)))
    include(implementation(fabricApi.module("fabric-networking-api-v1", fabric_api_version)))

    include(implementation('com.electronwill.night-config:toml:3.6.6'))
    include(implementation('com.electronwill.night-config:core:3.6.6'))

    include(implementation("org.lwjgl:lwjgl-openvr:${rootProject.lwjgl_version}") { transitive = false })
    include(implementation("org.lwjgl:lwjgl-openvr:${rootProject.lwjgl_version}:natives-linux") { transitive = false })
    include(implementation("org.lwjgl:lwjgl-openvr:${rootProject.lwjgl_version}:natives-linux-arm64") { transitive = false })
    include(implementation("org.lwjgl:lwjgl-openvr:${rootProject.lwjgl_version}:natives-macos") { transitive = false })
    include(implementation("org.lwjgl:lwjgl-openvr:${rootProject.lwjgl_version}:natives-windows") { transitive = false })

    // for OSC tracker support
    include(implementation("com.illposed.osc:javaosc-core:0.9"))

    // bHaptics Integration
    include(implementation("com.github.bhaptics:tact-java:0.1.4"))
    include(implementation("org.java-websocket:Java-WebSocket:1.5.1"))

}

