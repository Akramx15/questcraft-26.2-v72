name: Vivecraft 26.2

on:
  push:
    paths:
      - "Vivecraft-26.2-Quest/**"
      - ".github/workflows/vivecraft-26.2.yml"
  pull_request:
    paths:
      - "Vivecraft-26.2-Quest/**"
      - ".github/workflows/vivecraft-26.2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: Vivecraft-26.2-Quest/gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle wrapper executable
        run: chmod +x Vivecraft-26.2-Quest/gradlew

      - name: Run common tests
        working-directory: Vivecraft-26.2-Quest
        run: >-
          ./gradlew --no-daemon
          -Pproject.build.excludeForge=true
          -Pproject.build.excludeNeoforge=true
          :common:test

      - name: Build Fabric artifact
        working-directory: Vivecraft-26.2-Quest
        run: >-
          ./gradlew --no-daemon
          -Pproject.build.excludeForge=true
          -Pproject.build.excludeNeoforge=true
          :fabric:clean :fabric:build

      - name: Validate artifact
        shell: bash
        run: |
          jar --validate --file Vivecraft-26.2-Quest/build/libs/vivecraft-26.2-1.3.15-fabric.jar
          sha256sum Vivecraft-26.2-Quest/build/libs/vivecraft-26.2-1.3.15-fabric.jar

      - name: Upload Fabric artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivecraft-26.2-fabric
          path: Vivecraft-26.2-Quest/build/libs/vivecraft-26.2-1.3.15-fabric.jar
          if-no-files-found: error
