tasks.register('verifyImmersiveMcAttackBridgeContract') {
    group = 'verification'
    def stateSource = file(
            'src/main/java/org/questcraft/veq/client/input/ImmersiveAttackState.java')
    def routerSource = file(
            'src/main/java/org/questcraft/veq/client/input/PerHandWorldActionRouter.java')
    def subscriberMixin = file(
            'src/main/java/org/questcraft/veq/mixin/compat/immersivemc/' +
                    'ImmersiveMcClientVrSubscriberMixin.java')
    def trackerMixin = file(
            'src/main/java/org/questcraft/veq/mixin/compat/immersivemc/' +
                    'ImmersiveMcSwapTrackerMixin.java')
    def mixinConfig = file('src/main/resources/vivecraft_essentials_quest.mixins.json')
    inputs.files(stateSource, routerSource, subscriberMixin, trackerMixin, mixinConfig)
    doLast {
        String state = stateSource.getText('UTF-8')
        String router = routerSource.getText('UTF-8')
        String subscriber = subscriberMixin.getText('UTF-8')
        String tracker = trackerMixin.getText('UTF-8')
        String config = mixinConfig.getText('UTF-8')
        [
                'default -> originalKeyDown',
                'owner != HandActionPriority.Owner.IMMERSIVE',
                'owner != HandActionPriority.Owner.WORLD',
                'ImmersiveAttackState.suppress(hand)',
                'ImmersiveAttackState.beginFrame()',
                'ImmersiveAttackState.observe(',
                'ImmersiveAttackState.clear()',
                '@Pseudo',
                'require = 0',
                'ClientVRSubscriber',
                'handleInfos(Lcom/hammy275/immersivemc/api/client/immersive/Immersive;',
                'Lnet/minecraft/client/KeyMapping;isDown()Z'
        ].each { marker ->
            if (!(state + router + subscriber).contains(marker)) {
                throw new GradleException(
                        "ImmersiveMC subscriber bridge contract is missing ${marker}")
            }
        }
        int ownershipCapture = router.indexOf('HandOwnershipSnapshot.capture(')
        int attackObservation = router.indexOf(
                'ImmersiveAttackState.observe(', ownershipCapture)
        if (ownershipCapture < 0 || attackObservation < ownershipCapture) {
            throw new GradleException(
                    'ImmersiveMC attack samples must be ownership-gated before observation')
        }
        [
                '@Pseudo',
                'require = 0',
                'SwapTracker',
                '<init>(Lnet/minecraft/world/InteractionHand;)V',
                'Lnet/minecraft/client/KeyMapping;isDown()Z',
                'this.veq$interactionHand'
        ].each { marker ->
            if (!tracker.contains(marker)) {
                throw new GradleException(
                        "ImmersiveMC swap bridge contract is missing ${marker}")
            }
        }
        [
                'compat.immersivemc.ImmersiveMcClientVrSubscriberMixin',
                'compat.immersivemc.ImmersiveMcSwapTrackerMixin'
        ].each { mixin ->
            if (!config.contains('"' + mixin + '"')) {
                throw new GradleException("Optional ImmersiveMC mixin is unregistered: ${mixin}")
            }
        }
    }
}

