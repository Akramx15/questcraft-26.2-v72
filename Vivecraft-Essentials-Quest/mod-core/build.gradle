// The repository retains VEP history for LGPL attribution. Only the clean
// Vivecraft adapter namespace is compiled; none of the Visor API adapter or
// server/network code enters the distributable artifact.
sourceSets.main.java {
    include "org/questcraft/veq/**"
}
sourceSets.main.resources {
    include "assets/vivecraft_essentials_quest/**"
    // Original VEP inventory/creative/container artwork and translations.
    // Runtime classes remain in the clean org.questcraft namespace; only the
    // LGPL-attributed UI payload is packaged here.
    include "assets/visor_essentials/**"
    include "META-INF/**"
    include "vivecraft_essentials_quest.mixins.json"
}
sourceSets.test.java {
    include "org/questcraft/veq/**"
}

