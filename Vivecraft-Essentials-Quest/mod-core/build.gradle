tasks.register('verifyExternalOverlayActionSetContract') {
    group = 'verification'
    def mixinSource = file('src/main/java/org/questcraft/veq/mixin/MCOpenXRActionSetMixin.java')
    def mixinConfig = file('src/main/resources/vivecraft_essentials_quest.mixins.json')
    inputs.files(mixinSource, mixinConfig)
    doLast {
        String source = mixinSource.getText('UTF-8')
        String config = mixinConfig.getText('UTF-8')
        [
                '@Mixin(MCOpenXR.class)',
                'method = "updateActiveActionSets"',
                'KeyboardHandler;SHOWING:Z',
                'ExternalScreenOverlayHandler.ownsPointerInput()'
        ].each { marker ->
            if (!source.contains(marker)) {
                throw new GradleException("External overlay action-set contract is missing ${marker}")
            }
        }
        if (!config.contains('"MCOpenXRActionSetMixin"')) {
            throw new GradleException('MCOpenXRActionSetMixin must remain registered')
        }
        ['VRInputActionSet.GUI', 'Minecraft;screen'].each { forbidden ->
            if (source.contains(forbidden)) {
                throw new GradleException(
                        "External overlay input must not activate the GUI action set via ${forbidden}")
            }
        }
    }
}

