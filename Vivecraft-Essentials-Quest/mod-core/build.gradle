tasks.register('verifyOffhandWorldPointerContract') {
    group = 'verification'
    def stateSource = file(
            'src/main/java/org/questcraft/veq/client/input/OffhandWorldPointerState.java')
    def rendererSource = file(
            'src/main/java/org/questcraft/veq/client/render/OffhandWorldPointerRenderer.java')
    def mixinSource = file(
            'src/main/java/org/questcraft/veq/mixin/VREffectsHelperMixin.java')
    def mixinConfig = file('src/main/resources/vivecraft_essentials_quest.mixins.json')
    def routerSource = file(
            'src/main/java/org/questcraft/veq/client/input/PerHandWorldActionRouter.java')
    def vivecraftRoot = new File(rootProject.projectDir.parentFile, 'Vivecraft-26.2-Quest')
    def vrRenderStateSource = new File(vivecraftRoot,
            'common/src/main/java/org/vivecraft/client_vr/render/renderstates/VRRenderState.java')
    def minecraftVrMixinSource = new File(vivecraftRoot,
            'common/src/main/java/org/vivecraft/mixin/client_vr/MinecraftVRMixin.java')
    inputs.files(stateSource, rendererSource, mixinSource, mixinConfig, routerSource,
            vrRenderStateSource, minecraftVrMixinSource)
    doLast {
        String state = stateSource.getText('UTF-8')
        String renderer = rendererSource.getText('UTF-8')
        String mixin = mixinSource.getText('UTF-8')
        String config = mixinConfig.getText('UTF-8')
        String router = routerSource.getText('UTF-8')
        String vrRenderState = vrRenderStateSource.getText('UTF-8')
        String minecraftVrMixin = minecraftVrMixinSource.getText('UTF-8')
        ['ControllerType.LEFT', 'InteractionHand.OFF_HAND',
         'HandTargetSnapshot.capture(', 'WristOverlayHandler.isVisible()',
         'teleportTracker.isAiming()', 'minecraft.isPaused()',
         'minecraft.gui.overlay() != null',
         'dataHolder.vrPlayer.getVRDataWorld()',
         'QuestHandMapping.poseIndex(ControllerType.LEFT)',
         'renderPosition.subtract(target.start())'].each { marker ->
            if (!state.contains(marker)) {
                throw new GradleException("Offhand pointer state is missing ${marker}")
            }
        }
        if (state.contains('minecraft.hitResult') || renderer.contains('minecraft.hitResult')) {
            throw new GradleException('Offhand pointer must never touch the global hitResult')
        }
        if (state.contains('vrdata_world_pre')) {
            throw new GradleException(
                    'Visual offhand pointer must use the frame-current render pose, not the tick pose')
        }
        int firstPassGate = vrRenderState.indexOf('if (!dataHolder.isFirstPass) return;')
        int crosshairExtract = vrRenderState.indexOf(
                'VREffectsHelper.extractCrosshairState(this.crosshairState, player);')
        if (firstPassGate < 0 || crosshairExtract <= firstPassGate ||
                !minecraftVrMixin.contains('vrPlayer.preRender(')) {
            throw new GradleException(
                    'Offhand pointer must extract once per rendered frame after preRender pose creation')
        }
        ['renderVRFabulous', 'renderVrFast', 'extractCrosshairState'].each { marker ->
            if (!mixin.contains(marker)) {
                throw new GradleException("Offhand pointer mixin is missing ${marker}")
            }
        }
        if (!renderer.contains('RED = 0.20F') || !renderer.contains('GREEN = 0.90F') ||
                !renderer.contains('BLUE = 1.00F') ||
                !config.contains('"VREffectsHelperMixin"')) {
            throw new GradleException('Offhand pointer must remain a registered cyan marker')
        }
        if (!router.contains('PerHandWorldActionPolicy.Command.MAIN_USE_BUTTON') ||
                !router.contains('PerHandWorldActionPolicy.Command.OFFHAND_TRIGGER_USE') ||
                router.count('minecraft.hitResult') != 1) {
            throw new GradleException(
                    'B/right-main and LT/left-offhand routing contract regressed')
        }
    }
}

