architectury {
    common(rootProject.enabled_platforms.split(","))
}

def releasedFabricTransformIdentifier =
        'architectury_inject_VivecraftEssentialsQuest_modcore_849eb2d3888444f6bc04d4b91e5e8dc3_62c9ade18dbb5eb40b9b000721f3d820f530481dd2f157b22d870b46697a938bVivecraftEssentialsQuest070v71rc6devjar'

tasks.matching { it.name == 'transformProductionFabric' }.configureEach {
    // Architectury's default includes a per-worktree UUID and the absolute
    // input JAR path. Override both generated transformers with the identifier
    // already used by the frozen v71.rc6 artifact.
    inputs.property('veqArchitecturyIdentifier', releasedFabricTransformIdentifier)
    def configuredTransformers = getTransformers().get()
    def reproducibilityTransformers = configuredTransformers.findAll {
        it.class.simpleName in ['TransformExpectPlatform', 'RemapInjectables']
    }
    if (reproducibilityTransformers.size() != 2) {
        throw new GradleException(
                "Expected both Architectury generated-code transformers, found: " +
                        configuredTransformers*.class*.name)
    }
    def config = new dev.architectury.transformer.shadowed.impl.com.google.gson.JsonObject()
    config.addProperty('architectury.unique.identifier', releasedFabricTransformIdentifier)
    reproducibilityTransformers.each {
        it.supplyProperties(config)
    }
    getTransformers().set(configuredTransformers)
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

dependencies {
    compileOnly(libs.mixin)
    compileOnly(libs.fabric.loader)
    // Runtime is supplied by Fabric Loader/Vivecraft. The add-on never shades
    // Vivecraft and therefore remains independently replaceable under LGPLv3.
    compileOnly("io.github.llamalad7:mixinextras-fabric:0.5.4")

    def localVivecraftJar = rootProject.ext.resolveVivecraftFabricJar.call()
    compileOnly(files(localVivecraftJar))
    testImplementation(files(localVivecraftJar))

}

