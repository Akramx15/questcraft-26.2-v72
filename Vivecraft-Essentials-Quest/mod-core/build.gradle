tasks.register('verifyVepUiLifecycleAndPointerContract') {
    group = 'verification'
    def creativeSource = file(
            'src/main/java/org/questcraft/veq/client/gui/VepCreativeWristScreen.java')
    def inventorySource = file(
            'src/main/java/org/questcraft/veq/client/gui/VepWristInventoryScreen.java')
    def inventoryBaseSource = file(
            'src/main/java/org/questcraft/veq/client/gui/VepVrInventoryEffectScreen.java')
    def contextualSource = file(
            'src/main/java/org/questcraft/veq/client/overlay/VepContextualContainerRuntime.java')
    def pointerSource = file(
            'src/main/java/org/questcraft/veq/client/overlay/VepSurfacePointerRenderer.java')
    def renderPassSource = file(
            'src/main/java/org/questcraft/veq/client/overlay/ContextualContainerRenderPass.java')
    def containerMixinSource = file(
            'src/main/java/org/questcraft/veq/mixin/EmbeddedContainerScreenMixin.java')
    def creativeAccessorSource = file(
            'src/main/java/org/questcraft/veq/mixin/CreativeOutsideClickAccessor.java')
    def mixinConfigSource = file(
            'src/main/resources/vivecraft_essentials_quest.mixins.json')
    def adapterSource = file(
            'src/main/java/org/questcraft/veq/client/overlay/VepMultiSurfaceAdapter.java')
    def handlerSource = file(
            'src/main/java/org/questcraft/veq/client/overlay/WristOverlayHandler.java')
    def wristViewSource = file(
            'src/main/java/org/questcraft/veq/client/overlay/VepWristOverlayView.java')
    def wristPressPolicySource = file(
            'src/main/java/org/questcraft/veq/client/overlay/WristPointerPressPolicy.java')
    def redrawGateSource = file(
            'src/main/java/org/questcraft/veq/client/overlay/VepWristFrameRedrawGate.java')
    def screenContentSource = file(
            'src/main/java/org/questcraft/veq/client/overlay/VepScreenContent.java')
    inputs.files(creativeSource, inventorySource, inventoryBaseSource, contextualSource,
            pointerSource, renderPassSource, containerMixinSource,
            creativeAccessorSource, mixinConfigSource, adapterSource, handlerSource,
            wristViewSource, wristPressPolicySource, redrawGateSource, screenContentSource)
    doLast {
        String creative = creativeSource.getText('UTF-8')
        int creativeBackground = creative.indexOf(
                'super.extractBackground(graphics, mouseX, mouseY, partialTick);')
        int creativeStratum = creative.indexOf(
                'graphics.nextStratum();', creativeBackground)
        int creativeContent = creative.indexOf(
                'super.extractRenderState(graphics, mouseX, mouseY, partialTick);', creativeStratum)
        if (creativeBackground < 0 || creativeStratum < 0 || creativeContent < 0
                || !creative.contains('void extractTransparentBackground(')) {
            throw new GradleException(
                    'External Creative wrist must render a transparent native background, then content')
        }
        ['void hardClose()', 'player.containerMenu == getMenu()',
         'player.containerMenu = player.inventoryMenu'].each { marker ->
            if (!creative.contains(marker)) {
                throw new GradleException("Creative wrist lifecycle is missing ${marker}")
            }
        }
        String inventory = inventorySource.getText('UTF-8')
        if (creative.contains('VepSurfaceBackdrop.render(')
                || inventory.contains('VepSurfaceBackdrop.render(')) {
            throw new GradleException(
                    'Wrist content must retain VEP transparency instead of a full rectangular plate')
        }
        String inventoryBase = inventoryBaseSource.getText('UTF-8')
        int externalBackground = inventoryBase.indexOf(
                'renderVepBackground(graphics, partialTick, mouseX, mouseY);')
        int externalStratum = inventoryBase.indexOf(
                'graphics.nextStratum();', externalBackground)
        int externalContent = inventoryBase.indexOf(
                'renderVepContent(graphics, mouseX, mouseY, partialTick);', externalStratum)
        if (externalBackground < 0 || externalStratum < 0 || externalContent < 0) {
            throw new GradleException(
                    'External wrist rendering must include the VEP background before content')
        }
        if (!inventoryBase.contains('container/inventory/effect_background"')
                || !inventoryBase.contains('container/inventory/effect_background_ambient"')
                || inventoryBase.contains('effect_background_large')
                || inventoryBase.contains('effect_background_small')) {
            throw new GradleException(
                    'Potion panels must use the Minecraft 26.2 nine-slice sprites')
        }
        if (inventory.contains('renderCreativeAction(')
                || inventory.contains('isOverCreativeAction(')) {
            throw new GradleException(
                    'The redundant Creative Inventory banner must not be part of the wrist surface')
        }
        [creative, inventory].each { screen ->
            if (screen.contains('VepSurfacePointerRenderer.render')
                    || !screen.contains('hasClickedOutside(')) {
                throw new GradleException(
                        'Wrist screens must leave pointer composition to their surface and guard extended bounds')
            }
        }
        if (!inventory.contains('VepExtendedContainerInput.isOutside(')) {
            throw new GradleException('Inventory must guard its full extended bounds')
        }
        int creativeSuper = creative.indexOf(
                'boolean vanillaOutside = super.hasClickedOutside(')
        int creativeDecision = creative.indexOf(
                'VepExtendedContainerInput.creativeOutsideDecision(', creativeSuper)
        int creativeLatch = creative.indexOf(
                '.veq$setHasClickedOutside(decision.creativeLatch())', creativeDecision)
        String creativeAccessor = creativeAccessorSource.getText('UTF-8')
        String mixinConfig = mixinConfigSource.getText('UTF-8')
        if (creativeSuper < 0 || creativeDecision < 0 || creativeLatch < 0
                || !creativeAccessor.contains('@Accessor("hasClickedOutside")')
                || !mixinConfig.contains('"CreativeOutsideClickAccessor"')) {
            throw new GradleException(
                    'Creative must preserve Vanilla outside effects and synchronize its private latch')
        }
        String pointer = pointerSource.getText('UTF-8')
        if (!pointer.contains('RenderHelper.drawMouseMenuQuad(graphics, mouseX, mouseY)')
                || !pointer.contains('GuiRenderHelper.getGuiGraphics()')
                || pointer.count('screen.extractCarriedItem(') != 1
                || pointer.indexOf('screen.extractCarriedItem(')
                    < pointer.indexOf('RenderHelper.drawMouseMenuQuad(')
                || !pointer.contains('visibleBounds).resolve(surfaceWidth, surfaceHeight)')
                || !pointer.contains('CarriedItemPosition.clamp(')
                || pointer.contains('registerSurface(')
                || pointer.contains('GUI_CURSOR')) {
            throw new GradleException(
                    'The pointer must compose locally with the carried item above it')
        }
        String adapter = adapterSource.getText('UTF-8')
        String handler = handlerSource.getText('UTF-8')
        if (adapter.contains('CarriedSurface')
                || adapter.contains('VepCarriedItemScreen')
                || adapter.contains('registerSurface(')) {
            throw new GradleException(
                    'A separate carried-item surface would recreate coplanar VR flicker')
        }
        int wristDeferred = handler.indexOf(
                'ContextualContainerRenderPass.withCarriedDeferred(')
        int wristComposited = handler.indexOf(
                'VepSurfacePointerRenderer.renderPointerWithCarriedAbove(', wristDeferred)
        if (wristDeferred < 0 || wristComposited < 0
                || !handler.contains('void renderSurface(')
                || !handler.contains('void renderCarriedItem(')) {
            throw new GradleException(
                    'Wrist pointer and Vanilla carried item must be ordered on one render target')
        }
        String redrawGate = redrawGateSource.getText('UTF-8')
        int redrawDecision = redrawGate.indexOf('boolean shouldRedraw(')
        int redrawCommit = redrawGate.indexOf('void markRendered(', redrawDecision)
        if (!handler.contains('boolean usesRetainedContentTarget()')
                || !handler.contains('void redrawCompleted(')
                || !handler.contains('int hoverKey = hoverKey(cursor);')
                || redrawDecision < 0 || redrawCommit < 0
                || redrawGate.substring(redrawDecision, redrawCommit)
                    .contains('this.snapshotValid = true')) {
            throw new GradleException(
                    'Wrist base redraw must use a retained target and commit only after extraction')
        }
        String screenContent = screenContentSource.getText('UTF-8')
        if (!screenContent.contains('default int hoverKey(double x, double y)')
                || !screenContent.contains('return -1;')) {
            throw new GradleException(
                    'Hosted Creative/contextual screens need a stable unknown hover key')
        }
        String wristView = wristViewSource.getText('UTF-8')
        String wristPressPolicy = wristPressPolicySource.getText('UTF-8')
        int wristBoundsStart = wristView.indexOf(
                'public ExternalScreenOverlayHandler.SurfaceBounds bounds()')
        int wristBoundsEnd = wristView.indexOf(
                'public VepUiFeatureLayer featureLayer()', wristBoundsStart)
        if (wristBoundsStart < 0 || wristBoundsEnd < 0) {
            throw new GradleException('Wrist visual-bounds method could not be located')
        }
        String wristBounds = wristView.substring(wristBoundsStart, wristBoundsEnd)
        if (wristBounds.contains('getCarried()')
                || wristBounds.contains('carriedOwnership')
                || wristBounds.contains('refreshCarriedOwnership(')) {
            throw new GradleException(
                    'Carried input ownership must never expand or replace the wrist visual crop')
        }
        if (wristView.count('losePointerPose(') < 5
                || !wristView.contains('if (!retainCarriedRenderCursor(')
                || !wristView.contains(
                'cursor.set(cursor.x(), cursor.y(), controller, true, false, false)')) {
            throw new GradleException(
                    'Carried presentation must retain its last coordinate across ray/tracking loss')
        }
        if (!handler.contains('this.view.acceptsPointerPress(controller, button)')
                || !wristView.contains('boolean acceptsPointerPress(')
                || !wristView.contains('WristPointerPressPolicy.accepts(')
                || !wristPressPolicy.contains('exactCarriedOwner')
                || !wristPressPolicy.contains('!insideInteractionContent')
                || !wristPressPolicy.contains('PointerButton.SECONDARY')) {
            throw new GradleException(
                    'Carried owner must retain bounded outside-click/drop input on the wrist surface')
        }
        int acceptedMouseDown = wristView.indexOf(
                'boolean accepted = screen.mouseClicked(mouseEvent(index, button), false);')
        int immediateCarriedPin = wristView.indexOf(
                'pinCarriedOwnerAfterAcceptedPress(screen, controller);', acceptedMouseDown)
        int pressReturn = wristView.indexOf('return true;', immediateCarriedPin)
        if (acceptedMouseDown < 0 || immediateCarriedPin < 0 || pressReturn < 0
                || !wristView.contains('this.carriedOwnership.pinAfterAcceptedPress(')
                || !(acceptedMouseDown < immediateCarriedPin
                && immediateCarriedPin < pressReturn)) {
            throw new GradleException(
                    'Accepted pickup must pin carried ownership before another controller is processed')
        }
        String contextual = contextualSource.getText('UTF-8')
        ['PointerButton button', 'pointerScrolled(', 'pointerCancelled(',
         'cursor.x(), cursor.y()', 'void renderCarriedItem(',
         'VepSurfacePointerRenderer.renderPointerWithCarriedAbove(',
         'ContextualContainerRenderPass.withCarriedDeferred(',
         'VepSurfacePointerRenderer.canReceiveInput(',
         'VepSurfacePointerRenderer.isInsideUnitUv(uv.x, uv.y)'].each { marker ->
            if (!contextual.contains(marker)) {
                throw new GradleException("Contextual pointer contract is missing ${marker}")
            }
        }
        String renderPass = renderPassSource.getText('UTF-8')
        String containerMixin = containerMixinSource.getText('UTF-8')
        if (!renderPass.contains('try {') || !renderPass.contains('finally {')
                || !renderPass.contains('DEFERRED_CARRIED_SCREEN.remove()')
                || !containerMixin.contains('@Inject(method = "extractCarriedItem"')
                || !containerMixin.contains(
                'ContextualContainerRenderPass.isCarriedDeferred(this)')) {
            throw new GradleException(
                    'Contextual carried extraction must be exact-screen scoped and exception-safe')
        }
    }
}

