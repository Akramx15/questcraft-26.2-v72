tasks.register('verifyLicensedHotbarAssets') {
    group = 'verification'
    def hotbarDir = file('src/main/resources/assets/vivecraft_essentials_quest/textures/gui/hotbar')
    def notice = file('../THIRD_PARTY_NOTICES.md')
    def packagedNotice = file('src/main/resources/META-INF/THIRD_PARTY_NOTICES.md')
    def license = file('src/main/resources/META-INF/licenses/Visor-MPL-2.0.txt')
    inputs.dir(hotbarDir)
    inputs.files(notice, packagedNotice, license)
    doLast {
        def expected = [
                'default.png', 'top.png', 'top_right.png', 'right.png',
                'bottom_right.png', 'bottom.png', 'bottom_left.png', 'left.png',
                'top_left.png', 'hotbar_main_selected0.png',
                'hotbar_main_selected1.png', 'hotbar_offhand_selected0.png',
                'hotbar_offhand_selected1.png'
        ]
        expected.each { name ->
            if (!new File(hotbarDir, name).isFile()) {
                throw new GradleException("Missing licensed hotbar asset: ${name}")
            }
        }
        if (!notice.isFile() || !packagedNotice.isFile() || !license.isFile()) {
            throw new GradleException('Visor MPL notice/license must accompany the hotbar assets')
        }
    }
}

