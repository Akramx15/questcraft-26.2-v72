tasks.register('verifyWristSettingsFeatureBinding') {
    group = 'verification'
    description = 'Prevents the settings screen from writing legacy feature fields.'
    def source = file('src/main/java/org/questcraft/veq/client/gui/WristSettingsScreen.java')
    inputs.file(source)
    doLast {
        String text = source.getText('UTF-8')
        def required = [
                'private final VepFeatureConfig features',
                'features.beginEditing()',
                'features.applyEditing()',
                'features.cancelEditing()',
                'features.setShowPotionEffects',
                'features.setQuickActionDisplayMode',
                'features.setShowStatusHud',
                'features.setShowPlayerPreview',
                'features.setContextualContainers',
                'VepFeatureConfig.OptionalIntegration.XAERO',
                'VepFeatureConfig.OptionalIntegration.JEI',
                'VepFeatureConfig.OptionalIntegration.INVENTORY_PROFILES_NEXT'
        ]
        required.each { marker ->
            if (!text.contains(marker)) {
                throw new GradleException("Wrist settings are missing feature binding: ${marker}")
            }
        }
        if (text.contains('config.setShowPotionEffects')
                || text.contains('config.setQuickActionDisplayMode')) {
            throw new GradleException(
                    'Wrist settings must not write legacy potion/quick-action fields')
        }
        if (text.contains('features.setCreativeWrist')) {
            throw new GradleException(
                    'Wrist settings must not expose the redundant embedded Creative action')
        }
    }
}

tasks.register('verifyWristPoseEditorContract') {
    group = 'verification'
    description = 'Keeps pose editing transactional, live and independent of persisted state.'
    def settingsSource = file('src/main/java/org/questcraft/veq/client/gui/WristSettingsScreen.java')
    def trackerSource = file('src/main/java/org/questcraft/veq/client/wrist/WristInventoryTracker.java')
    def handlerSource = file('src/main/java/org/questcraft/veq/client/overlay/WristOverlayHandler.java')
    inputs.files(settingsSource, trackerSource, handlerSource)
    doLast {
        String settings = settingsSource.getText('UTF-8')
        [
                'config.beginEditing()',
                'config.applyEditing()',
                'config.cancelEditing()',
                'WristOverlayHandler.beginCalibration',
                'WristOverlayHandler.cancelCalibrationGrab()',
                'WristOverlayHandler.refreshCalibrationPreview()',
                'config.resetPose(activeController())',
                'config.flipFace(activeController())'
        ].each { marker ->
            if (!settings.contains(marker)) {
                throw new GradleException("Wrist pose editor is missing ${marker}")
            }
        }
        String tracker = trackerSource.getText('UTF-8')
        if (!tracker.contains('(!config.enabled() && !editingPose)')
                || !tracker.contains('if (WristOverlayHandler.isCalibrating()) {')
                || !tracker.contains('WristOverlayHandler.setVisible(true);')) {
            throw new GradleException('Disabled wrist must remain forced-visible while editing')
        }
        String handler = handlerSource.getText('UTF-8')
        [
                'updateRoomPoseInternal(config, anchor);',
                'this.roomPosition,',
                'this.roomRotation,',
                'shouldRetainVisibility()'
        ].each { marker ->
            if (!handler.contains(marker)) {
                throw new GradleException("Live pose preview/visibility is missing ${marker}")
            }
        }
    }
}

