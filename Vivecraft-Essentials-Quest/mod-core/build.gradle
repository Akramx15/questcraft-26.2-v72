tasks.register('verifyHandedGripAndDualRayContract') {
    group = 'verification'
    def vivecraftRoot = new File(rootProject.projectDir.parentFile, 'Vivecraft-26.2-Quest')
    def keySource = new File(vivecraftRoot,
            'common/src/main/java/org/vivecraft/client/VivecraftVRMod.java')
    def radialSource = new File(vivecraftRoot,
            'common/src/main/java/org/vivecraft/client_vr/gameplay/screenhandlers/RadialHandler.java')
    def handSource = file('src/main/java/org/questcraft/veq/client/input/PerHandWorldActionRouter.java')
    def transientSource = file('src/main/java/org/questcraft/veq/client/input/PerHandTransientState.java')
    def ownershipSource = file('src/main/java/org/questcraft/veq/client/input/HandOwnershipSnapshot.java')
    def targetSource = file('src/main/java/org/questcraft/veq/client/input/HandTargetSnapshot.java')
    def bindingSource = file('src/main/java/org/questcraft/veq/client/input/QuestGripBindingPolicy.java')
    def buttonLayoutSource = file('src/main/java/org/questcraft/veq/client/input/QuestButtonLayout.java')
    def buttonKeysSource = file('src/main/java/org/questcraft/veq/client/input/QuestButtonKeyMappings.java')
    def radialControllerSource = file(
            'src/main/java/org/questcraft/veq/client/radial/RadialHotbarController.java')
    def handMixinSource = file('src/main/java/org/questcraft/veq/mixin/MinecraftHandActionMixin.java')
    inputs.files(keySource, radialSource, handSource, transientSource, ownershipSource,
            targetSource, bindingSource, buttonLayoutSource, buttonKeysSource,
            radialControllerSource, handMixinSource)
    doLast {
        def keyText = keySource.getText('UTF-8')
        if (!keyText.contains('HandedKeyBinding keyRadialMenu') ||
                !keyText.contains('HandedKeyBinding keyMainAttack') ||
                !keyText.contains('HandedKeyBinding keyOffhandUse') ||
                !keyText.contains('HandedKeyBinding keyOffhandUseButton') ||
                !keyText.contains('hiddenKeyBindingSet.add(this.keyOffhandUseButton)')) {
            throw new GradleException('Grip, main attack, trigger use, and B use must remain registered handed actions')
        }
        def radialText = radialSource.getText('UTF-8')
        if (radialText.contains('controller != null ? controller : ControllerType.RIGHT') ||
                !radialText.contains('sampleRadialRelease(activeController)') ||
                !radialText.contains('RadialReleaseLatch.Decision.SELECT_AND_CLOSE') ||
                !radialText.contains('new RadialSession(controller') ||
                !radialText.contains('isControllerTracking(activeController)')) {
            throw new GradleException('Radial opener/release must be latched and null-fail-closed')
        }
        def handText = handSource.getText('UTF-8')
        def transientText = transientSource.getText('UTF-8')
        def ownershipText = ownershipSource.getText('UTF-8')
        def targetText = targetSource.getText('UTF-8')
        def bindingText = bindingSource.getText('UTF-8')
        def buttonLayoutText = buttonLayoutSource.getText('UTF-8')
        def buttonKeysText = buttonKeysSource.getText('UTF-8')
        def radialControllerText = radialControllerSource.getText('UTF-8')
        def handMixinText = handMixinSource.getText('UTF-8')
        if (!handText.contains('PerHandWorldActionPolicy.Command.MAIN_ATTACK') ||
                !handText.contains('PerHandWorldActionPolicy.Command.MAIN_USE_BUTTON') ||
                !handText.contains('PerHandWorldActionPolicy.Command.OFFHAND_TRIGGER_USE') ||
                !handText.contains('PerHandWorldActionPolicy.attackBreakThisHand(') ||
                !handText.contains('ClientNetworking.supportsOffhandAttackRouting()') ||
                !handText.contains('ClientHandActionTickGuard.global().claimEntityAttack(') ||
                !handText.contains('guard.coordinateButtonMiningIntents(') ||
                !handText.contains('miningFrame.plan().routeNativeMain()') ||
                !handText.contains('plan.customTargetSource()') ||
                !handText.contains('attackBreakUseChannelFree(') ||
                !handText.contains('attackBreakEntityDispatchAllowed(') ||
                handText.contains('? !uses.mainUse() && !attackShouldRoute') ||
                handText.contains('ClientHandActionTickGuard.global().claimButtonMiningContribution(') ||
                !handText.contains('started && minecraft.gameMode.isDestroying()') ||
                !handText.contains('ClientNetworking.sendActiveHand(hand, true)') ||
                handText.contains('offhandTriggerDecision(') ||
                !handText.contains('ClientNetworking.cannotAttackWithItemForBodyPart(') ||
                !handText.contains('minecraft.hitResult = target.primaryHit()') ||
                handText.count('minecraft.hitResult') != 1 ||
                !handText.contains('IndependentHandUseLatch') ||
                !handText.contains('PerHandTransientState') ||
                transientText.count('IndependentUseCooldown') < 2 ||
                !handText.contains('keyMainAttack') ||
                !handText.contains('keyOffhandUse') ||
                !handText.contains('keyOffhandUseButton') ||
                handText.contains('options.keyUse') ||
                !handText.contains('PerHandWorldActionPolicy.blockUseDecision(') ||
                !handText.contains('getWorldBorder().isWithinBounds(') ||
                handText.count('isMineableBlockHit(blockHit,') < 2 ||
                !handText.contains('hit.getType() == HitResult.Type.BLOCK && !air') ||
                !handText.contains('this.lifecycle.observe(') ||
                !transientText.contains('this.useLatch.suppressUntilRelease()') ||
                !transientText.contains('ExternalHandUseState.setHeld(false)') ||
                !ownershipText.contains('bowTracker.isNotched()') ||
                !ownershipText.contains('bowTracker.isDrawing()') ||
                !ownershipText.contains('ExternalScreenOverlayHandler.isUsingController(controller)') ||
                !targetText.contains('HandRaycastFluidPolicy.forUse(stack)') ||
                !targetText.contains('new AABB(start, end).inflate(1.0D)') ||
                !targetText.contains('entity != player.getVehicle()') ||
                !bindingText.contains('layout.action(button).actionPaths()') ||
                !buttonLayoutText.contains(
                        'QuestFaceButton.RIGHT_B, QuestButtonAction.MAIN_HAND_USE') ||
                !buttonLayoutText.contains(
                        'QuestFaceButton.LEFT_Y, QuestButtonAction.ATTACK_BREAK_THIS_HAND') ||
                !buttonKeysText.contains('/actions/mod/in/') ||
                !handText.contains('QuestButtonKeyMappings.attackBreakThisHandButton()') ||
                !handText.contains('updateMainAttacks(') ||
                !handMixinText.contains('@Mixin(value = Minecraft.class, priority = 1000)') ||
                !handMixinText.contains('@Inject(method = "tick", at = @At("HEAD"))')) {
            throw new GradleException('v67 router must keep independent right attack, right B use and left trigger use')
        }
        // The reviewed Grip branch adds this API. Force its explicit lifecycle
        // cancellation to be wired when that source is integrated; reflection
        // or a dependency on the unreviewed branch would hide a stale session.
        if (radialControllerText.contains('public static void cancel()') &&
                !handText.contains('RadialHotbarController.cancel();')) {
            throw new GradleException(
                    'Grip RadialHotbarController.cancel() must be called by VR shutdown routing')
        }
    }
}

